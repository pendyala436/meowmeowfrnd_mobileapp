    <!-- Prevent FOUC — apply saved color theme + light/dark mode before React loads -->
    <script>
      (function () {
        try {
          var themeId = localStorage.getItem("app-theme") || "frnd";
          var mode = localStorage.getItem("app-theme-mode") || "system";
          if (mode !== "light" && mode !== "dark" && mode !== "system") {
            mode = "system";
          }
          var dark;
          if (mode === "dark") {
            dark = true;
          } else if (mode === "light") {
            dark = false;
          } else {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.setAttribute("data-theme", themeId);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          // localStorage may throw in private browsing
        }
      })();
    </script>

    <!-- Cache recovery: clear stale service workers on genuine load failures -->
    <script>
      (function () {
        var APP_MOUNTED_ATTR = "data-app-mounted";
        var isAndroid = /Android/i.test(navigator.userAgent);
        var timeout = isAndroid ? 20000 : 25000;

        function isMounted() {
          return document.documentElement.getAttribute(APP_MOUNTED_ATTR) === "true";
        }

        // Force SW update check on Android
        if (isAndroid && "serviceWorker" in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                if (r.active) r.update();
              });
            });
          } catch (e) {}
        }

        var timer = setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || isMounted()) return;

          // Don't recover on very slow connections
          try {
            if (
              navigator.connection &&
              navigator.connection.effectiveType &&
              navigator.connection.effectiveType.includes("2g")
            ) {
              return;
            }
          } catch (e) {}

          var recoveryKey = "sw-recovery";
          var attempts = parseInt(sessionStorage.getItem(recoveryKey) || "0", 10);

          // Allow up to 3 recovery attempts before showing hard-fail
          if (attempts >= 3) {
            root.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0d14;color:#fff;font-family:sans-serif;padding:20px;text-align:center"><div><h1 style="font-size:20px;margin-bottom:12px">Loading failed</h1><p style="color:#888;margin-bottom:20px;font-size:14px">The app could not load. This is usually caused by a stale cache or an older browser.</p><button onclick="(async function(){try{if(\'serviceWorker\' in navigator){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(r){return r.unregister()}))}if(\'caches\' in window){var k=await caches.keys();await Promise.all(k.map(function(k){return caches.delete(k)}))}sessionStorage.clear();location.reload()}catch(e){location.reload()}})()" style="padding:12px 28px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;min-height:44px">Clear Cache & Reload</button></div></div>';
            return;
          }

          sessionStorage.setItem(recoveryKey, String(attempts + 1));

          // Hard-wipe caches FIRST, then unregister SW
          var cleanupPromises = [];
          if ("caches" in window) {
            cleanupPromises.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              }),
            );
          }
          if ("serviceWorker" in navigator) {
            cleanupPromises.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  }),
                );
              }),
            );
          }

          Promise.all(cleanupPromises)
            .then(function () {
              setTimeout(function () {
                location.reload();
              }, 500);
            })
            .catch(function () {
              setTimeout(function () {
                location.reload();
              }, 500);
            });
        }, timeout);

        var observer;
        try {
          observer = new MutationObserver(function () {
            if (isMounted()) {
              clearTimeout(timer);
              sessionStorage.removeItem("sw-recovery");
              observer.disconnect();
            }
          });
          observer.observe(document.documentElement, {
            attributes: true,
            attributeFilter: [APP_MOUNTED_ATTR],
          });
        } catch (e) {
          // MutationObserver not supported — fallback poll
          var poll = setInterval(function () {
            if (isMounted()) {
              clearTimeout(timer);
              sessionStorage.removeItem("sw-recovery");
              clearInterval(poll);
            }
          }, 1000);
        }
      })();
    </script>

    <!-- Android: force SW update after load, gated by app-mounted check -->
    <script>
      if (/Android/i.test(navigator.userAgent) && "serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          try {
            navigator.serviceWorker.ready.then(function (reg) {
              reg.update();
              reg.addEventListener("updatefound", function () {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener("statechange", function () {
                    if (newWorker.state === "activated") {
                      // Only reload if app has mounted — prevents infinite reload loop
                      if (
                        document.visibilityState === "visible" &&
                        document.documentElement.getAttribute("data-app-mounted") === "true"
                      ) {
                        location.reload();
                      }
                    }
                  });
                }
              });
            });
          } catch (e) {}
        });
      }
    </script>
