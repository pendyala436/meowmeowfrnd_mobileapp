name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

  deploy:
    name: Deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://www.meow-meow.co.in:8443
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg1ODE0NjI4LCJleHAiOjIxMDExNzQ2Mjh9.Y-xSzsoWio6UlfzA0hL4Zra6hno-zG81-VwCpalUcbk
    steps:
      - name: Migrate DB + deploy meow-app via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          username: ${{ vars.SSH_USER || secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ vars.SSH_PORT || 22 }}
          envs: SUDO_PASSWORD
          script_stop: true
          command_timeout: 55m
          script: |
            set -euo pipefail

            if [ -z "${SUDO_PASSWORD:-}" ]; then
              echo "SUDO_PASSWORD was not forwarded to the remote shell"
              exit 1
            fi

            APP_DIR="${{ vars.APP_DIR || '/meowmeow/app/new_project' }}"
            COMPOSE_DIR="${{ vars.COMPOSE_DIR || '/meowmeow/app' }}"

            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' bash -c "
              set -euo pipefail
              APP_DIR='$APP_DIR'
              COMPOSE_DIR='$COMPOSE_DIR'

              echo \"==> Updating source in \$APP_DIR\"
              cd \"\$APP_DIR\"
              git fetch origin main
              git checkout main
              # Discard local server edits so deploy always matches GitHub main.
              git reset --hard origin/main
              git clean -fd --exclude=.env --exclude=.env.production --exclude='.env.*'

              echo '==> Applying pending DB migrations'
              chmod +x scripts/unix/apply-pending-migrations.sh
              scripts/unix/apply-pending-migrations.sh \"\$APP_DIR\"

              echo '==> Building meow-app:latest'
              docker build --no-cache -t meow-app:latest .

              echo \"==> Recreating bun-app from \$COMPOSE_DIR\"
              cd \"\$COMPOSE_DIR\"
              docker compose up -d --no-deps --force-recreate bun-app

              echo '==> Deploy finished'
              docker image inspect meow-app:latest --format 'image={{.Id}} created={{.Created}}'
              docker compose ps bun-app
            "

      - name: Validate Financial Single Source of Truth
        run: |
          set -euo pipefail
          echo "::group::SoT validator output"
          RESPONSE=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/validate_financial_sot" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$RESPONSE" | python3 -m json.tool
          echo "::endgroup::"

          # RPC returns TABLE rows: [{check_name, status, details}, ...]
          echo "$RESPONSE" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)

          if isinstance(data, dict) and data.get("message"):
              print("RPC error:", data.get("message"), file=sys.stderr)
              sys.exit(1)

          if isinstance(data, dict) and "ok" in data:
              checks = data.get("checks") or []
              ok = bool(data.get("ok"))
          elif isinstance(data, list):
              checks = data
              ok = all(str(c.get("status", "")).upper() != "FAIL" for c in checks)
          else:
              print("Unexpected SoT response type:", type(data).__name__, file=sys.stderr)
              sys.exit(1)

          for c in checks:
              name = c.get("check_name") or c.get("name") or "?"
              status = str(c.get("status") or ("PASS" if c.get("pass") else "FAIL")).upper()
              detail = c.get("details") if "details" in c else c.get("detail", {})
              print(f"  {status} {name}: {detail}")

          if not checks:
              print("SoT returned no checks", file=sys.stderr)
              sys.exit(1)

          if not ok:
              print("Financial SoT validation FAILED.", file=sys.stderr)
              sys.exit(1)
          print("All SoT checks passed.")
          '
